const EquipoFormView = {
  setup(){
    const route = VueRouter.useRoute();
    const router = VueRouter.useRouter();
    const isEdit = computed(()=> route.path.includes('/editar'));
    const existing = computed(()=> isEdit.value ? eqById(route.params.id) : null);

    const form = reactive({
      tipo:'',marca:'',modelo:'',sn:'',codigoInterno:'',estado:'activo',
      ubicacion:'',responsable:'',proveedor:'',factura:'',
      costo:'',fechaAdquisicion:'',fechaGarantia:'',vidaUtil:5,
      especificaciones:'',notas:''
    });
    if(existing.value){
      Object.assign(form, {
        tipo:existing.value.tipo, marca:existing.value.marca, modelo:existing.value.modelo,
        sn:existing.value.sn, codigoInterno:existing.value.codigoInterno, estado:existing.value.estado,
        ubicacion:existing.value.ubicacion,
        responsable:existing.value.responsable, proveedor:existing.value.proveedor, factura:existing.value.factura,
        costo:existing.value.costo, fechaAdquisicion:existing.value.fechaAdquisicion, fechaGarantia:existing.value.fechaGarantia,
        vidaUtil:existing.value.vidaUtil, especificaciones:JSON.stringify(existing.value.especificaciones,null,2), notas:existing.value.notas||''
      });
    }

    const tipoOptions = ['Laptop','Desktop','Monitor','Impresora','Servidor','Switch','Router','UPS'];
    const estadoOptions = [{v:'activo',l:'Activo'},{v:'almacen',l:'En Almacén'},{v:'reparacion',l:'En Reparación'},{v:'baja',l:'Baja'}];
    const addUbicacion = () => {
      const nombre = prompt('Nombre de la nueva ubicación:');
      if (nombre && nombre.trim()) {
        const val = nombre.trim();
        if (!DB.ubicaciones.includes(val)) {
          DB.ubicaciones.push(val);
          form.ubicacion = val;
          toast.success('Ubicación agregada: ' + val);
        } else {
          form.ubicacion = val;
          toast.info('Esa ubicación ya existe');
        }
      }
    };
    const errors = computed(()=>{
      const e = {};
      if(!form.tipo) e.tipo='Requerido';
      if(!form.marca) e.marca='Requerido';
      if(!form.modelo) e.modelo='Requerido';
      if(!form.sn) e.sn='Requerido';
      else if(!/^[A-Z0-9-]+$/.test(form.sn)) e.sn='Solo mayúsculas, números y guiones';
      if(form.costo && Number(form.costo)<0) e.costo='Debe ser positivo';
      if(form.fechaAdquisicion && form.fechaGarantia && form.fechaGarantia<form.fechaAdquisicion) e.fechaGarantia='Debe ser posterior a la adquisición';
      return e;
    });
    const isValid = computed(()=> !form.tipo || !form.marca || !form.modelo || !form.sn ? false : Object.keys(errors.value).length===0);
    const snToUpper = () => { form.sn = form.sn.toUpperCase(); };
    const nextCodigoFor = (tipo) => {
      const tipoMap = {Laptop:'LP',Desktop:'DT',Monitor:'MN',Impresora:'IM',Servidor:'SR',Switch:'SW',Router:'RT',UPS:'UP'};
      const base = 'INV-'+(tipoMap[tipo]||'EQ')+'-';
      const used = new Set(DB.equipos.map(e=>e.codigoInterno).filter(Boolean));
      if(isEdit.value && existing.value) used.delete(existing.value.codigoInterno);
      let n = 1;
      let code;
      do { code = base+String(n).padStart(3,'0'); n++; } while(used.has(code));
      return code;
    };
    const genCodigo = () => {
      form.codigoInterno = nextCodigoFor(form.tipo);
      toast.info('Código generado');
    };

    const saving = ref(false);
    const buildData = () => {
      let espec = {};
      try { espec = form.especificaciones ? JSON.parse(form.especificaciones) : {}; } catch(e){ espec = {}; }
      return {
        tipo:form.tipo, marca:form.marca, modelo:form.modelo, sn:form.sn,
        codigoInterno:form.codigoInterno || nextCodigoFor(form.tipo),
        estado:form.estado,
        ubicacion:form.ubicacion||'',
        responsable:form.responsable||'—', proveedor:form.proveedor||'', factura:form.factura||'',
        costo:Number(form.costo)||0, fechaAdquisicion:form.fechaAdquisicion||'', fechaGarantia:form.fechaGarantia||'',
        vidaUtil:Number(form.vidaUtil)||5, especificaciones:espec, notas:form.notas||''
      };
    };
    const save = async () => {
      if(!isValid.value){ toast.error('Revisá los campos del formulario'); return; }
      saving.value = true;
      const data = buildData();
      try {
        if(isEdit.value){
          await updateEquipo(existing.value.id, data);
          toast.success('Equipo actualizado y sincronizado');
          saving.value = false;
          router.push('/equipos');
        } else {
          const newId = await addEquipo(data);
          toast.success('Equipo registrado · Código QR generado automáticamente');
          saving.value = false;
          router.push('/equipos/'+newId+'?tab=qr');
        }
      } catch(e){ saving.value=false; toast.error('Error al guardar: '+e.message); }
    };
    return { DB, form, isEdit, tipoOptions, estadoOptions, addUbicacion, errors, isValid, snToUpper, genCodigo, save, saving, goBack:()=>router.back() };
  },

const UsuariosView = {
  setup(){
    const loading = ref(true);
    const users = ref([]);
    const tab = ref('todos');
    const loadUsers = async () => {
      try {
        const data = await apiFetch('/api/usuarios');
        users.value = data.users;
      } catch(e) { toast.error('Error al cargar usuarios'); }
      loading.value = false;
    };
    onMounted(()=>{ loadUsers(); });
    // Botón manual: el admin hace clic y se actualiza la lista al instante
    const refresh = async () => {
      loading.value = true;
      await loadUsers();
      toast.success('Lista actualizada');
    };
    const selectTab = (t) => { tab.value = t; };
    const counts = computed(() => {
      const pendientes = users.value.filter(u => u.estado === 'pendiente').length;
      const activos = users.value.filter(u => u.estado === 'activo').length;
      return {
        pendientes,
        activos,
        todos: pendientes + activos,
      };
    });
    const filtered = computed(() => {
      if (tab.value === 'activos') return users.value.filter(u => u.estado === 'activo');
      if (tab.value === 'pendientes') return users.value.filter(u => u.estado === 'pendiente');
      // "todos" muestra solo pendientes y activos (coincide con el conteo)
      return users.value.filter(u => u.estado === 'activo' || u.estado === 'pendiente');
    });
    const rolBadge = (r) => ({admin:'blue',tecnico:'active'}[r]||'gray');
    const rolLabel = (r) => ({admin:'Administrativo',tecnico:'Técnico'}[r]||r);
    const estadoBadge = (e) => ({activo:'active',pendiente:'repair',inactivo:'gray'}[e]||'gray');
    const estadoLabel = (e) => ({activo:'Activo',pendiente:'Pendiente',inactivo:'Inactivo'}[e]||e);
    // Aprobar: cambia a activo → desaparece de pendientes, aparece en activos
    const aprobar = async (id) => {
      try {
        await apiFetch('/api/usuarios/' + id, { method:'PATCH', body: JSON.stringify({ accion:'aprobar' }) });
        toast.success('Solicitud aprobada · Usuario activado');
        await loadUsers();
      } catch(e) { toast.error(e.message); }
    };
    // Rechazar: elimina el usuario → desaparece de pendientes
    const rechazar = async (id) => {
      try {
        await apiFetch('/api/usuarios/' + id, { method:'PATCH', body: JSON.stringify({ accion:'rechazar' }) });
        toast.info('Solicitud rechazada · Usuario eliminado');
        await loadUsers();
      } catch(e) { toast.error(e.message); }
    };
    const desactivar = async (id) => {
      try {
        await apiFetch('/api/usuarios/' + id, { method:'PATCH', body: JSON.stringify({ accion:'desactivar' }) });
        toast.info('Usuario desactivado');
        await loadUsers();
      } catch(e) { toast.error(e.message); }
    };
    const formatDate = (d) => new Date(d).toLocaleString('es-AR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    return { loading, users, tab, counts, filtered, rolBadge, rolLabel, estadoBadge, estadoLabel, aprobar, rechazar, desactivar, formatDate, refresh, selectTab };
  },
  template:`

    <div class="page-head">
      <div>

        <div class="page-subtitle">Gestión de accesos y aprobación de solicitudes pendientes</div>

        <button class="btn btn-primary" @click="refresh"><span class="ic" v-html="$icon('refresh')"></span>Actualizar lista</button>

    <div class="tabs">
      <div :class="['tab',{active:tab==='pendientes'}]" @click="selectTab('pendientes')">Pendientes ({{counts.pendientes}})</div>
      <div :class="['tab',{active:tab==='activos'}]" @click="selectTab('activos')">Activos ({{counts.activos}})</div>
      <div :class="['tab',{active:tab==='todos'}]" @click="selectTab('todos')">Todos ({{counts.todos}})</div>

    <template v-else>

        <div class="empty-state">
          <span v-html="$icon('users')"></span>
          <div class="et">No hay usuarios en esta categoría</div>
          <div class="es">Cambiá de pestaña para ver Activos o Todos los usuarios</div>

          <table class="data-table">

            </thead>
            <tbody>
              <tr v-for="u in filtered" :key="u.id">
                <td><span class="sn-tag">{{u.usuario}}</span></td>
                <td>
                  <div style="display:flex;align-items:center;gap:10px">
                    <div class="user-avatar" style="width:30px;height:30px;font-size:13px">{{u.nombre.charAt(0)}}</div>

const SearchModal = {
  setup(){
    const router = VueRouter.useRouter();
    const q = ref('');
    const results = computed(()=>{
      if(!q.value.trim()) return [];
      const t = q.value.toLowerCase();
      return DB.equipos.filter(e =>
        e.marca.toLowerCase().includes(t) || e.modelo.toLowerCase().includes(t) ||
        e.sn.toLowerCase().includes(t) || e.tipo.toLowerCase().includes(t) ||
        (e.responsable||'').toLowerCase().includes(t) || (e.ubicacion||'').toLowerCase().includes(t)
      ).slice(0,8);
    });
    const close = () => { ui.searchOpen=false; q.value=''; };
    const go = (id) => { close(); router.push('/equipos/'+id); };
    const onInput = (e) => { if(e.key==='Enter' && results.value.length) go(results.value[0].id); };
    onMounted(()=>{
      nextTick(()=>{ const inp = document.querySelector('.search-input-wrap input'); if(inp) inp.focus(); });
    });
    return { q, results, close, go, onInput, estadoMeta };
  },
  template:`
  <div class="search-modal" @click.self="close">
    <div class="search-box">
      <div class="search-input-wrap">
        <span v-html="$icon('search')"></span>

/* ============================================================
   QR SCANNER (real camera + jsQR decoding)
   ============================================================ */
const QRScanner = {
  setup(){
    const videoEl = ref(null);
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently:true });
    const scanning = ref(false);
    const error = ref('');
    const result = ref('');
    const foundEquipo = ref(null);
    let stream = null;
    let rafId = null;

    const startCamera = async () => {
      error.value = '';
      result.value = '';
      foundEquipo.value = null;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        await nextTick();
        if (videoEl.value) {
          videoEl.value.srcObject = stream;
          videoEl.value.setAttribute('playsinline', true);
          await videoEl.value.play();
          scanning.value = true;
          tick();
        }
      } catch(e) {
        error.value = 'No se pudo acceder a la cámara. Verificá los permisos del navegador.';
        toast.error('Cámara no disponible');
      }
    };

    const tick = () => {
      if (!scanning.value || !videoEl.value) return;
      if (videoEl.value.readyState === videoEl.value.HAVE_ENOUGH_DATA) {
        canvas.height = videoEl.value.videoHeight;
        canvas.width = videoEl.value.videoWidth;
        ctx.drawImage(videoEl.value, 0, 0, canvas.width, canvas.height);
        try {
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = (typeof jsQR !== 'undefined') ? jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts:'attemptBoth' }) : null;
          if (code && code.data) {
            handleResult(code.data);
            return;
          }
        } catch(e) {}
      }
      rafId = requestAnimationFrame(tick);
    };

    const handleResult = (data) => {
      result.value = data;
      const urlMatch = /#\/(?:qr|equipos)\/([^/?#]+)/.exec(data);
      let eq = urlMatch ? eqById(urlMatch[1]) : null;
      if (!eq) eq = DB.equipos.find(e => e.sn === data || e.codigoInterno === data);
      foundEquipo.value = eq || null;
      scanning.value = false;
      stopCamera();
      if (eq) toast.success('Equipo encontrado: ' + eq.marca + ' ' + eq.modelo);
      else toast.info('QR leído: ' + data);
    };

    const stopCamera = () => {
      scanning.value = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    };

    const close = () => { stopCamera(); ui.qrScannerOpen = false; result.value=''; foundEquipo.value=null; error.value=''; };
    const manualMode = () => { stopCamera(); scanning.value = false; };

    onMounted(()=>{ startCamera(); });
    onBeforeUnmount(()=>{ stopCamera(); });

    return { videoEl, scanning, error, result, foundEquipo, close, manualMode, startCamera, estadoMeta, formatMoney };
  },
  template:`
  <div class="qr-scanner" @click.self="close">
    <div class="qr-scanner-box">
      <div class="qr-scanner-head">
        <h3><span v-html="$icon('qr')"></span>Escanear QR de equipo</h3>
        <button class="modal-close" @click="close" v-html="$icon('x')"></button>
      </div>
      <div class="qr-scanner-body">
        <div v-if="error" class="qr-scanner-error">
          <span v-html="$icon('alert')"></span>
          <div>{{error}}</div>
          <button class="btn btn-outline btn-sm" style="margin-top:14px" @click="startCamera">Reintentar</button>
        </div>
        <template v-else>
          <div class="qr-video-wrap" v-show="!result">
            <video ref="videoEl" muted></video>
            <div class="qr-scan-overlay">
              <div class="qr-scan-frame"></div>
              <div class="qr-scan-line"></div>
            </div>
          </div>
          <div class="qr-scanner-hint" v-if="!result">Enfocá el código QR del equipo dentro del marco</div>
          <div v-if="result && foundEquipo" class="qr-scanner-result">
            <div class="detail-title-row" style="margin-bottom:0">
              <div>
                <div style="font-size:17px;color:var(--white);font-weight:700">{{foundEquipo.marca}} {{foundEquipo.modelo}}</div>
                <div class="detail-sub" style="margin-top:4px"><span class="sn-tag">{{foundEquipo.sn}}</span> · {{foundEquipo.codigoInterno}}</div>
              </div>
              <span :class="['badge','lg',estadoMeta(foundEquipo.estado).cls]"><span class="bdot"></span>{{estadoMeta(foundEquipo.estado).label}}</span>
            </div>
            <div class="data-grid" style="margin-top:16px">
              <div class="data-field"><span class="dl">Tipo</span><span class="dv">{{foundEquipo.tipo}}</span></div>
              <div class="data-field"><span class="dl">Ubicación</span><span class="dv">{{foundEquipo.ubicacion || '—'}}</span></div>
              <div class="data-field"><span class="dl">Responsable</span><span class="dv">{{foundEquipo.responsable}}</span></div>
              <div class="data-field"><span class="dl">Proveedor</span><span class="dv">{{foundEquipo.proveedor || '—'}}</span></div>
              <div class="data-field"><span class="dl">Costo</span><span class="dv mono">{{formatMoney(foundEquipo.costo)}}</span></div>
              <div class="data-field"><span class="dl">Fecha de adquisición</span><span class="dv mono">{{foundEquipo.fechaAdquisicion || '—'}}</span></div>
              <div class="data-field"><span class="dl">Garantía hasta</span><span class="dv mono">{{foundEquipo.fechaGarantia || '—'}}</span></div>
              <div class="data-field"><span class="dl">Vida útil</span><span class="dv">{{foundEquipo.vidaUtil}} años</span></div>
            </div>
            <div v-if="foundEquipo.especificaciones && Object.keys(foundEquipo.especificaciones).length" style="margin-top:16px">
              <div class="panel-sub" style="margin-bottom:10px">ESPECIFICACIONES TÉCNICAS</div>
              <div class="spec-block">
                <div v-for="(v,k) in foundEquipo.especificaciones" :key="k"><span class="sk">{{k}}:</span> <span class="sv">{{v}}</span></div>
              </div>
            </div>
            <div v-if="foundEquipo.notas" style="margin-top:16px">
              <div class="panel-sub" style="margin-bottom:8px">NOTAS</div>
              <div style="font-size:13.5px;color:var(--gray-300);line-height:1.6">{{foundEquipo.notas}}</div>
            </div>
          </div>
          <div v-else-if="result" class="qr-scanner-result">
            <div class="rlabel">CÓDIGO LEÍDO</div>
            <div class="rval">{{result}}</div>
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-700);font-size:13px;color:var(--gray-500)">
              No se encontró un equipo con ese identificador en el inventario.
            </div>
          </div>
          <div class="qr-scanner-actions" v-if="result">
            <button class="btn btn-primary btn-block" @click="result=''; foundEquipo=null; startCamera()">Escanear otro</button>
          </div>
        </template>
      </div>
    </div>
  </div>`
};

/* ============================================================
   ROOT APP
   ============================================================ */
const App = {
  components:{SplashScreen,ToastHost,SearchModal,QRScanner},
  setup(){
    provide(AUTH_KEY, auth);
    provide(TOAST_KEY, toast);
    const showSplash = ref(true);
    onMounted(()=>{
      setTimeout(()=>{ showSplash.value=false; }, 4000);
      if ('serviceWorker' in navigator) {
        // Service Worker desactivado para evitar problemas de cache durante desarrollo
        // navigator.serviceWorker.register('/sw.js').catch(()=>{});
      }
    });
    const scrollToId = (id) => { const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); };
    const iconSvg = (name) => iconFor(name);
    const typeIconHtml = (tipo) => typeIcon(tipo);
    const toggleOnline = () => setOnline(!syncState.online);
    return { showSplash, scrollToId, iconSvg, typeIconHtml, toggleSidebar, toggleOnline, toastStore, ui, db:DB };
  },
  template:`
  <div class="noise-overlay"></div>
  <transition name="splash"><splash-screen v-if="showSplash"></splash-screen></transition>
  <toast-host v-if="!showSplash"></toast-host>
  <search-modal v-if="ui.searchOpen && !showSplash"></search-modal>
  <q-r-scanner v-if="ui.qrScannerOpen && !showSplash"></q-r-scanner>
  <router-view v-if="!showSplash" v-slot="{ Component }">
    <component :is="Component"></component>
  </router-view>`
};

/* ============================================================
   QR PUBLIC VIEW — consulta de equipo sin login (para el QR físico)
   ============================================================ */
const QRPublicView = {
  components:{LogoMark},
  setup(){
    const route = VueRouter.useRoute();
    const loading = ref(true);
    const notFound = ref(false);
    const eq = ref(null);
    onMounted(async ()=>{
      try {
        const res = await fetch('/api/public/equipos/' + route.params.id);
        if(!res.ok){ notFound.value = true; return; }
        const data = await res.json();
        eq.value = {
          ...data.equipo,
          especificaciones: data.equipo.especificaciones ? JSON.parse(data.equipo.especificaciones) : {},
        };
      } catch(e) {
        notFound.value = true;
      } finally {
        loading.value = false;
      }
    });
    return { loading, notFound, eq, estadoMeta, formatMoney };
  },
  template:`
  <div class="qr-public-page">
    <div class="qr-public-header">
      <router-link to="/" class="navbar-brand"><logo-mark/><span>INV<span class="brand-v">-</span>OTI</span></router-link>
      <router-link to="/login" class="btn btn-outline btn-sm" style="margin-left:auto">Iniciar sesión</router-link>
    </div>
    <div class="qr-public-body">
      <template v-if="loading">
        <div class="panel"><div class="skeleton sk-line w90" v-for="i in 6" :key="i"></div></div>
      </template>
      <template v-else-if="notFound || !eq">
        <div class="empty-state">
          <span v-html="$icon('alert')"></span>
          <div class="et">Equipo no encontrado</div>
          <div class="es">Este código QR no corresponde a ningún equipo registrado en el inventario.</div>
        </div>
      </template>
      <template v-else>
        <div class="panel">
          <div class="detail-title-row" style="margin-bottom:0">
            <div>
              <div class="detail-title">{{eq.marca}} {{eq.modelo}}</div>
              <div class="detail-sub" style="margin-top:6px"><span class="sn-tag">{{eq.sn}}</span> · {{eq.codigoInterno}}</div>
            </div>
            <span :class="['badge','lg',estadoMeta(eq.estado).cls]"><span class="bdot"></span>{{estadoMeta(eq.estado).label}}</span>
          </div>
          <div class="data-grid" style="margin-top:20px">
            <div class="data-field"><span class="dl">Tipo</span><span class="dv">{{eq.tipo}}</span></div>
            <div class="data-field"><span class="dl">Ubicación</span><span class="dv">{{eq.ubicacion || '—'}}</span></div>
            <div class="data-field"><span class="dl">Responsable</span><span class="dv">{{eq.responsable || '—'}}</span></div>
            <div class="data-field"><span class="dl">Proveedor</span><span class="dv">{{eq.proveedor || '—'}}</span></div>
            <div class="data-field"><span class="dl">Costo</span><span class="dv mono">{{formatMoney(eq.costo)}}</span></div>
            <div class="data-field"><span class="dl">Fecha de adquisición</span><span class="dv mono">{{eq.fechaAdquisicion || '—'}}</span></div>
            <div class="data-field"><span class="dl">Garantía hasta</span><span class="dv mono">{{eq.fechaGarantia || '—'}}</span></div>
            <div class="data-field"><span class="dl">Vida útil</span><span class="dv">{{eq.vidaUtil}} años</span></div>
          </div>
          <div v-if="Object.keys(eq.especificaciones).length" style="margin-top:24px">
            <div class="panel-sub" style="margin-bottom:10px">ESPECIFICACIONES TÉCNICAS</div>
            <div class="spec-block">
              <div v-for="(v,k) in eq.especificaciones" :key="k"><span class="sk">{{k}}:</span> <span class="sv">{{v}}</span></div>
            </div>
          </div>
          <div v-if="eq.notas" style="margin-top:20px">
            <div class="panel-sub" style="margin-bottom:8px">NOTAS</div>
            <div style="font-size:13.5px;color:var(--gray-300);line-height:1.6">{{eq.notas}}</div>
          </div>
        </div>
      </template>
    </div>
  </div>`
};

/* ============================================================
   ROUTER
   ============================================================ */
const routes = [
  { path:'/', component:LandingPage },
  { path:'/login', component:LoginPage },
  { path:'/registro', component:RegisterPage },
  { path:'/qr/:id', component:QRPublicView },
  {
    path:'/', component:AppLayout,
    children:[
      { path:'dashboard', component:DashboardView, meta:{requiresAuth:true,bc:'Dashboard'} },
      { path:'equipos', component:EquiposListView, meta:{requiresAuth:true,bc:'Equipos'} },
      { path:'equipos/nuevo', component:EquipoFormView, meta:{requiresAuth:true,bc:'Nuevo equipo'} },
      { path:'equipos/:id', component:EquipoDetailView, meta:{requiresAuth:true,bc:'Detalle'} },
      { path:'equipos/:id/editar', component:EquipoFormView, meta:{requiresAuth:true,bc:'Editar'} },
      { path:'mantenimientos', component:MantenimientosView, meta:{requiresAuth:true,bc:'Mantenimientos'} },
      { path:'reportes', component:ReportesView, meta:{requiresAuth:true,bc:'Reportes'} },
      { path:'admin/usuarios', component:UsuariosView, meta:{requiresAuth:true,requiresAdmin:true,bc:'Usuarios'} },
    ]
  },
  { path:'/:pathMatch(.*)*', redirect:'/' },
];
const router = createRouter({
  history:createWebHashHistory(),
  routes,
  scrollBehavior(){ return {top:0} }
});
router.beforeEach((to, from, next) => {
  if(to.meta.requiresAuth && !auth.user){ next('/login'); return; }
  if(to.meta.requiresAdmin && (!auth.user || auth.user.rol!=='admin')){ next('/dashboard'); return; }
  if((to.path==='/login' || to.path==='/registro') && auth.user){ next('/dashboard'); return; }
  next();
});

const app = createApp(App);
app.config.globalProperties.$icon = iconFor;
app.use(router);
app.mount('#app');
</script>
